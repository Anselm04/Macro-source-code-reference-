name: One-time pinned Macro source tree audit
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            docs
            TRILLIONAI_REFERENCE.md
      - name: Compare upstream and actual main Git objects (no source execution)
        shell: bash
        env:
          UPSTREAM_SHA: 532fba5e60c14b91ae641619c32a58120b6b4546
          UPSTREAM_URL: https://github.com/macro-inc/macro.git
        run: |
          set -euo pipefail
          git init -q /tmp/reference-audit-upstream
          git -C /tmp/reference-audit-upstream remote add origin "$UPSTREAM_URL"
          git -C /tmp/reference-audit-upstream -c protocol.version=2 fetch -q --depth 1 --filter=blob:none origin "$UPSTREAM_SHA"
          test "$(git -C /tmp/reference-audit-upstream rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git -C /tmp/reference-audit-upstream ls-tree -rz HEAD > /tmp/upstream-tree-zero 2>/dev/null || git -C /tmp/reference-audit-upstream ls-tree -rz FETCH_HEAD > /tmp/upstream-tree-zero
          git ls-tree -rz HEAD > /tmp/main-tree-zero
          python3 - <<'PY'
          import os, subprocess, json
          from pathlib import Path
          sha=os.environ["UPSTREAM_SHA"]
          def tree(repo,rev):
              raw=subprocess.check_output(["git","-C",repo,"ls-tree","-rz",rev])
              d={}
              for e in raw.split(b"\0"):
                  if not e: continue
                  meta,p=e.split(b"\t",1)
                  mode,kind,oid=meta.decode().split()
                  d[p.decode("utf-8","surrogateescape")]={"mode":mode,"type":kind,"sha":oid}
              return d
          up=tree("/tmp/reference-audit-upstream","FETCH_HEAD")
          local=tree(".","HEAD")
          missing=sorted(set(up)-set(local))
          mismatch=sorted(p for p in set(up)&set(local) if up[p]!=local[p])
          extra=sorted(set(local)-set(up))
          known_ci=[p for p in missing if p.startswith(".github/workflows/")]
          unknown_missing=[p for p in missing if p not in known_ci]
          report={"upstream":"https://github.com/macro-inc/macro","upstream_commit":sha,"destination_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"upstream_git_entries":len(up),"destination_git_entries":len(local),"missing_total":len(missing),"missing_ci_workflows":len(known_ci),"other_missing":len(unknown_missing),"sha_or_mode_mismatch":len(mismatch),"extra_destination_entries":len(extra),"missing_paths":missing,"mismatched_objects":[{"path":p,"upstream":up[p],"destination":local[p]} for p in mismatch],"extra_paths":extra}
          out=Path("docs/verified-source-audit")
          out.mkdir(parents=True,exist_ok=True)
          (out/"macro-upstream-main-delta.json").write_text(json.dumps(report,indent=2)+"\n")
          (out/"macro-summary.md").write_text("# Macro pinned upstream versus current main\n\n"+f"- Upstream revision: `{sha}`\n- Upstream Git entries: **{len(up)}**\n- Destination Git entries: **{len(local)}**\n- Missing tracked paths: **{len(missing)}** (of which upstream CI workflows: **{len(known_ci)}**)\n- Other missing paths: **{len(unknown_missing)}**\n- SHA/mode mismatches: **{len(mismatch)}**\n- Extra destination entries: **{len(extra)}**\n\nThis compares Git-tracked files, symlink Git objects, and submodule pointers at a pinned revision. It does not retrieve submodule contents, LFS data, or external/private source. It does not execute upstream code. See JSON for every path/object difference.\n")
          print(json.dumps({k:v for k,v in report.items() if not isinstance(v,list)},indent=2))
          PY
          rm .github/workflows/audit-source-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit: record byte-identity and file-mode differences against pinned Macro upstream'
          git push origin HEAD:main
