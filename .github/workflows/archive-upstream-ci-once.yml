name: Archive upstream Macro workflow source inertly
on:
  push:
    paths:
      - '.github/workflows/archive-upstream-ci-once.yml'
permissions:
  contents: write
jobs:
  archive:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-inert-ci-archive.yml@main
    with:
      upstream_url: https://github.com/macro-inc/macro.git
      upstream_sha: 532fba5e60c14b91ae641619c32a58120b6b4546
      archive_slug: macro
